# GitHub Actions - Build Android APK + AAB + Web (DOMUS)
# Builds Android natively using expo prebuild + Gradle
# Builds Web using expo export

name: Build Android & Web

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_SECRET }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat >> gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_SECRET }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true

      - name: Rename APK and AAB
        id: apk
        run: |
          VERSION=$(jq -r '.version' package.json)
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            APK_NAME="domus-${TAG}.apk"
            AAB_NAME="domus-${TAG}.aab"
          else
            APK_NAME="domus-v${VERSION}-${SHORT_SHA}.apk"
            AAB_NAME="domus-v${VERSION}-${SHORT_SHA}.aab"
          fi
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$APK_NAME" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "aab_name=$AAB_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Publish pre-release (push na main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ steps.apk.outputs.short_sha }}
          name: DOMUS v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.short_sha }} (pré-release)
          prerelease: true
          generate_release_notes: false
          files: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.aab_name }}

      - name: Publish release (tag v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DOMUS ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.aab_name }}

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Web
        run: npx expo export --platform web

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: domus-web
          path: dist/
          retention-days: 30
