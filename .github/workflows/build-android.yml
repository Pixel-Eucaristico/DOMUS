# GitHub Actions - Build Android APK + AAB + Web (DOMUS)
# Builds Android natively using expo prebuild + Gradle
# Builds Web using expo export

name: Build Android & Web

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar pré-release (desmarcado, só gera o APK e o AAB como artefatos do run)"
        type: boolean
        default: true

# Só leitura por padrão; `contents: write` só no job que publica release.
permissions:
  contents: read

jobs:
  # Lint, tipos e testes (gate.yml) antes de qualquer build: com o gate
  # vermelho, nenhum APK, AAB ou pré-release é gerado.
  gate:
    name: Gate
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml

  build-android:
    name: Build Release APK
    needs: gate
    # Único job com escrita: publica a pré-release e o release (action-gh-release
    # usa o GITHUB_TOKEN pela API; nenhum passo dá git push).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Assina com a chave de upload só se os 4 secrets existirem; com o
      # keystore e algum dos outros faltando, o passo "Check signing secrets"
      # falha logo no início.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/share/powershell /usr/local/lib/heroku
          sudo apt-get clean
          df -h /

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 ausente: o release sai assinado com a chave de depuração."
            exit 0
          fi
          missing=""
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 está configurado, mas faltam os secrets:$missing"
            exit 1
          fi
          echo "Secrets de assinatura completos (HAS_KEYSTORE=$HAS_KEYSTORE)."

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Inject Google OAuth env vars
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          # Escreve .env para garantir que Metro/Expo injete as vars no bundle JS
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" >> .env
          echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" >> .env

          # Patching google-services.json com oauth_client (necessario para native Android sign-in)
          jq \
            --arg android "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" \
            --arg web    "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" \
          '
            .client[0].oauth_client = [
              {"client_id": $android, "client_type": 1,
               "android_info": {"package_name": "br.com.pixeleucaristico.domus"}},
              {"client_id": $web, "client_type": 3}
            ] |
            .client[0].services.appinvite_service.other_platform_oauth_client = [
              {"client_id": $web, "client_type": 3}
            ]
          ' google-services.json > google-services.tmp.json \
          && mv google-services.tmp.json google-services.json

      - name: Expo prebuild (Android)
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: npx expo prebuild --platform android --clean --no-install

      # O `if` não enxerga o `env` do próprio passo; a checagem vem dos secrets
      # pelo env do job (HAS_KEYSTORE). Só o keystore vai para o disco; as
      # senhas chegam ao Gradle pelo env do passo de build.
      - name: Configure signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      # ORG_GRADLE_PROJECT_<NOME> vira a propriedade de projeto <NOME>, então
      # project.hasProperty('MYAPP_UPLOAD_STORE_FILE') (plugins/withReleaseSigning.js)
      # continua valendo, sem gravar senhas no gradle.properties (caracteres como
      # \ : = # $ não quebram nada). Sem keystore, as variáveis nem existem.
      - name: Build release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            export ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE=release.keystore
            export ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dorg.gradle.parallel=true

      # Com HAS_KEYSTORE=true o APK tem de sair com a chave de upload: se o
      # certificado for o de depuração do template, o build falha.
      - name: Verify APK certificate
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não encontrado em $ANDROID_HOME/build-tools"
            exit 1
          fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK não existe (o release saiu sem assinatura?)"
            exit 1
          fi
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::HAS_KEYSTORE=true, mas o APK foi assinado com a chave de depuração (CN=Android Debug)."
            exit 1
          fi

      - name: Rename APK and AAB
        id: apk
        run: |
          VERSION=$(jq -r '.version' package.json)
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            APK_NAME="domus-${TAG}.apk"
            AAB_NAME="domus-${TAG}.aab"
          else
            APK_NAME="domus-v${VERSION}-${SHORT_SHA}.apk"
            AAB_NAME="domus-v${VERSION}-${SHORT_SHA}.aab"
          fi
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$APK_NAME" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "aab_name=$AAB_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      # Sempre anexa APK/AAB como artefatos do run — permite baixar builds de
      # qualquer branch (workflow_dispatch) sem esperar merge na main
      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: domus-android-${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.short_sha }}
          path: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.aab_name }}
          retention-days: 14

      # No disparo manual, só publica com o input `publish` marcado (padrão).
      - name: Publish pre-release (push na main ou disparo manual com publish)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: pre-${{ steps.apk.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          name: DOMUS v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.short_sha }} (pré-release)
          prerelease: true
          generate_release_notes: false
          files: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.aab_name }}

      - name: Publish release (tag v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: DOMUS ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.aab_name }}

  build-web:
    name: Build Web
    needs: gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Web
        run: npx expo export --platform web

      - name: Upload Web Build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: domus-web
          path: dist/
          retention-days: 30
