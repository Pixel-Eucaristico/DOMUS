# GitHub Actions - Build iOS (Orcafacil / DOMUS)
# Builds natively without EAS Build, using expo prebuild + Xcode
# Requer macOS runner (gratis no GitHub Actions)

name: Build iOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (iOS)
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS archive (no signing)
        working-directory: ios
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          xcodebuild \
            -workspace domus.xcworkspace \
            -scheme domus \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/domus.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: domus-ios-archive
          path: build/domus.xcarchive
          retention-days: 30

